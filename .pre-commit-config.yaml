repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        args:
          - --dot
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.25.0
    hooks:
      - id: toml-sort-fix
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args:
          - --quote-props=as-needed
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        types: [python]
        # Pass files directly or let mypy use its configured paths
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --config=pyproject.toml .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --config=pyproject.toml .
        language: system
        pass_filenames: false
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
        exclude: ^docs/docs/assets/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
